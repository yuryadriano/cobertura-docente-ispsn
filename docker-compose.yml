version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO DA APLICAÇÃO PHP (Módulo Cobertura Docente ISPSN)
  # ─────────────────────────────────────────────────────────────────
  app-php:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-sftcoordenacao_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-test123}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads-docentes:/var/www/html/public/uploads
      - app-backups:/var/www/html/storage/backups

  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO DA BASE DE DADOS MYSQL
  # ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sftcoordenacao_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-test123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-test123}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO PHPMYADMIN (Gestão de BD)
  # ─────────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-test123}
      UPLOAD_LIMIT: 300M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  uploads-docentes:
  app-backups:
