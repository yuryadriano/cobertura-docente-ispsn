<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ISPSN · BackOffice — Cobertura Docente 2026/27 (Protótipo)</title>
<style>
:root{
  --gold:#E8B10C; --gold-d:#C9970A; --blue:#1F4E79; --blue2:#2E75B6; --blue3:#2a78d6;
  --ink:#1a1a1a; --mut:#6b6a66; --line:#e2e0d9; --surf:#ffffff; --bg:#f4f2ec;
  --ok:#1E8449; --okf:#e5f4ea; --warn:#B9770E; --warnf:#fdf3e0; --bad:#C0392B; --badf:#fbeae8;
  --aqua:#1baf7a; --violet:#4a3aa7;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* top bar */
.top{background:linear-gradient(90deg,var(--gold),var(--gold-d));color:#1a1a1a;display:flex;align-items:center;gap:14px;padding:0 18px;height:56px;position:sticky;top:0;z-index:30;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain;border:2px solid var(--blue);flex-shrink:0;display:block}
.top h1{font-size:15px;margin:0;font-weight:700}
.top .yr{font-weight:800;font-size:18px;margin-left:2px}
.top .sp{flex:1}
.rolebox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.35);padding:5px 10px;border-radius:8px}
.rolebox select{border:0;background:#fff;border-radius:6px;padding:4px 6px;font-weight:600;color:var(--blue)}
.user{font-weight:600;font-size:13px}
/* layout */
.wrap{display:flex;min-height:calc(100vh - 56px)}
.nav{width:210px;background:#fff;border-right:1px solid var(--line);padding:14px 0;flex-shrink:0}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--ink);text-decoration:none;font-weight:600;font-size:13.5px;border-left:3px solid transparent}
.bar{height:8px;border-radius:5px;background:#eee;overflow:hidden;min-width:90px;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--okf);color:var(--ok)} .pill.warn{background:var(--warnf);color:var(--warn)} .pill.bad{background:var(--badf);color:var(--bad)} .pill.mut{background:#eee;color:var(--mut)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{background:#173e61}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.gold{background:var(--gold-d);color:#fff}.btn.gold:hover{background:#a67f08}
.btn.sm{padding:5px 10px;font-size:12px}
/* controls */
.ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ctrls label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:3px}
select,input[type=text],input[type=number],textarea{border:1px solid #cdcbc4;border-radius:7px;padding:7px 9px;font-family:inherit;font-size:13px;background:#fff}
select:focus,input:focus,textarea:focus{outline:2px solid #bcd3ee;border-color:var(--blue2)}
.tabs{display:flex;gap:4px;margin-bottom:2px;flex-wrap:wrap}
.tabs button{background:#eee;border:0;border-radius:8px 8px 0 0;padding:8px 16px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--blue);border:1px solid var(--line);border-bottom:2px solid #fff}
/* plan grid */
.plan{font-size:12.5px}
.plan th{font-size:11px}
.plan td{padding:5px 7px;vertical-align:middle}
.plan .semhd td{background:var(--blue);color:#fff;font-weight:700;font-size:12px}
.plan select,.plan input{padding:4px 6px;font-size:12px;width:100%;min-width:70px}
.auto{background:#f2f2f2;color:#333;border-radius:5px;padding:3px 6px;font-size:11.5px;display:inline-block;min-width:40px}
.auto.empty{color:#aaa}
td.docsel{min-width:180px}
.rownum{color:var(--mut);font-weight:700;text-align:center}
/* docs */
.docgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.doccard{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}
.doccard .t{font-weight:700;font-size:13px;margin-bottom:4px}
.doccard .s{font-size:11.5px;color:var(--mut);margin-bottom:10px}
.drop{border:2px dashed #cfd7e0;border-radius:8px;padding:14px;text-align:center;color:var(--mut);font-size:12px;background:#fafcff}
.drop.done{border-color:var(--ok);background:var(--okf);color:var(--ok);font-weight:600}
/* form */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.frm .full{grid-column:1/3}
.frm .fld label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.frm .fld input,.frm .fld select,.frm .fld textarea{width:100%}
.note{background:#f0f5fb;border-left:3px solid var(--blue2);padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;color:#333;margin:14px 0}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.flow .n{background:#eef3fa;border:1px solid #d5e2f2;border-radius:6px;padding:5px 9px;font-weight:600;color:var(--blue)}
.flow .ar{color:var(--gold-d);font-weight:800}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ok);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;z-index:60}
.toast.show{opacity:1;transform:none}
.legend{font-size:11.5px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}.docgrid{grid-template-columns:1fr 1fr}.frm{grid-template-columns:1fr}.frm .full{grid-column:1}.nav{display:none}}
</style>
</head>

function ensureTurma(year,curso,turma){
  state.plan3[year]=state.plan3[year]||{};
  state.plan3[year][curso]=state.plan3[year][curso]||{};
  if(state.plan3[year][curso][turma]) return;
  const ano=anoOf(turma);
  const p={}; let id=0;
  const sems=(DATA.curriculo[curso]||{})[ano]||{};
  [['1','I'],['2','II']].forEach(([sn,sl])=>{
    (sems[sn]||[]).forEach(uc=>{
      const sug=(DATA.ref[curso]||{})[norm(uc)]||'';
      p[id]={id,ano,sem:sl,uc,docente:'',conf:'',just:'',regime:'',ass:'',aval:'',sug: year==='2026/27'?sug:''};
      id++;
    });
  });
  state.plan3[year][curso][turma]=p;
}
function curTurmaPlan(){ ensureTurma(state.year,state.curso,state.turma); return state.plan3[state.year][state.curso][state.turma]; }
function isHist(){ return state.year==='2025/26'; }
function setYear(){ state.year=document.getElementById('year').value; state.turma=null; render(); }
// estatísticas de um curso (todas as turmas): nº de atribuições
function turmaStats(curso){
  const turmas=turmasDe(curso);
  let cells=0,done=0,conf=0;
  turmas.forEach(t=>{
    ensureTurma(state.year,curso,t.cod);
    const rows=Object.values(state.plan3[state.year][curso][t.cod]);
    cells+=rows.length;
    done+=rows.filter(r=>r.docente).length;
    conf+=rows.filter(r=>r.conf==='Sim').length;
  });
  return {turmas:turmas.length,cells,done,conf,pct:pct(conf,cells)};
}

function setDoc(id,val){ if(!P().editCob){toast('Perfil sem permissão para editar a cobertura');return;} curTurmaPlan()[id].docente=val; render(); }
function setF(id,f,val){ if(!P().editCob){toast('Perfil sem permissão para editar a cobertura');return;} curTurmaPlan()[id][f]=val; if(f==='conf')render(); }
function applyAll(id){
  if(!P().editCob){toast('Perfil sem permissão para editar a cobertura');return;}
  const row=curTurmaPlan()[id]; const ano=anoOf(state.turma);
  turmasDe(state.curso).filter(t=>t.ano===ano).forEach(t=>{
    ensureTurma(state.year,state.curso,t.cod);
    const pl=state.plan3[state.year][state.curso][t.cod];
    const target=Object.values(pl).find(r=>r.uc===row.uc && r.sem===row.sem);
    if(target){ target.docente=row.docente; if(row.conf)target.conf=row.conf; if(row.just)target.just=row.just; if(row.regime)target.regime=row.regime; }
  });
  toast(`${row.docente} atribuído a «${row.uc}» em todas as turmas do ${ano}.º ano`);
  render();
}

  const regs=['','Tempo Integral','Tempo Parcial','Colaborador'].map(o=>`<option ${o===cv.regime?'selected':''}>${o||'—'}</option>`).join('');
  const T=(id,lbl,val,full)=>`<div class="fld${full?' full':''}"><label>${lbl}</label><input type="text" id="${id}" value="${(val||'').replace(/"/g,'&quot;')}"></div>`;
  const TA=(id,lbl,val)=>`<div class="fld full"><label>${lbl}</label><textarea id="${id}" rows="2" style="width:100%">${val||''}</textarea></div>`;
  return `<h2 class="page">CV Estruturado do Docente <span class="demo-tag" style="background:#eef;color:#33f;border-color:#ccd">Modelo MESCTI</span></h2>
   <p class="sub">Estrutura do modelo oficial do MESCTI, preenchida por campos. Os campos assinalados <span class="pill ok" style="font-size:10px">↳ plano</span> alimentam automaticamente a ficha do docente e o plano de cobertura.</p>
   <div class="ctrls"><div><label>Docente</label>
     <select onchange="state._cvfor=this.value;render()">${DATA.docentes.map(x=>`<option ${x.n===who?'selected':''}>${x.n}</option>`).join('')}</select></div></div>

   <div class="card"><div class="hd">1. Identificação</div><div class="bd"><div class="frm">
     <div class="fld"><label>Nome e Apelidos</label><input type="text" value="${who}" disabled style="background:#f2f2f2"></div>
     ${T('cv_email','Email',cv.email)}
     ${T('cv_nasc','Data de nascimento',cv.nasc)}
     ${T('cv_tel','Telefone',cv.tel)}
     ${T('cv_resid','Residência',cv.resid,true)}
   </div></div></div>

   <div class="card"><div class="hd">2. Formação académica e títulos</div><div class="bd"><div class="frm">
     <div class="fld"><label>Grau académico mais elevado <span class="pill ok" style="font-size:10px">↳ plano</span></label><select id="cv_grau">${gopts}</select></div>
     <div class="fld"><label>Especialidade / área de formação <span class="pill ok" style="font-size:10px">↳ plano</span></label><input type="text" id="cv_esp" value="${(cv.esp||'').replace(/"/g,'&quot;')}"></div>
     ${T('cv_licInst','Licenciado em — Instituição',cv.licInst)}
     ${T('cv_mestArea','Mestrado — área',cv.mestArea)}
     ${T('cv_mestInst','Mestrado — Instituição',cv.mestInst)}
     ${T('cv_doutArea','Doutoramento — área',cv.doutArea)}
     ${T('cv_doutInst','Doutoramento — Instituição',cv.doutInst)}
     ${T('cv_outros','Outros títulos / especializações',cv.outros)}
     ${T('cv_grauCient','Grau científico',cv.grauCient)}
     ${T('cv_tituloAcad','Título académico',cv.tituloAcad)}
     ${T('cv_catCient','Categoria científica',cv.catCient)}
     <div class="fld"><label>Categoria docente (carreira) <span class="pill ok" style="font-size:10px">↳ plano</span></label><select id="cv_cat">${cats}</select></div>
     <div class="fld"><label>Declaração INAAREES <span class="pill ok" style="font-size:10px">↳ plano</span></label><select id="cv_ina">${simnao(cv.ina)}</select></div>
     <div class="fld"><label>Capacitação psicopedagógica <span class="pill ok" style="font-size:10px">↳ plano</span></label><select id="cv_ped">${simnao(cv.ped)}</select></div>
   </div></div></div>

   <div class="card"><div class="hd">3. Situação profissional</div><div class="bd"><div class="frm">
     ${T('cv_trabalho','Trabalho que desempenha',cv.trabalho)}
     ${T('cv_ies','Universidade ou Instituição (IES)',cv.ies)}
     <div class="fld"><label>Regime contratual com a IES <span class="pill ok" style="font-size:10px">↳ plano</span></label><select id="cv_regime">${regs}</select></div>
     <div class="fld"><label>Anos de experiência no Ensino Superior <span class="pill ok" style="font-size:10px">↳ plano</span></label><input type="number" id="cv_exp" value="${cv.exp}" min="0"></div>
   </div></div></div>

   <div class="card"><div class="hd">4. Investigação, docência e produção científica</div><div class="bd"><div class="frm">
     ${TA('cv_linhas','Linhas de pesquisa e as 3 investigações/atividades mais importantes (últimos 5 anos)',cv.linhas)}
     ${TA('cv_ministra','Cursos que ministra — Graduação',cv.ministra)}
     ${TA('cv_ministraPos','Cursos que ministra — Pós-Graduação',cv.ministraPos)}
     ${TA('cv_publicacoes','Últimas 3 publicações/patentes/trabalhos (título, revista/evento, editorial, ano, país)',cv.publicacoes)}
     <div class="fld"><label>N.º de publicações/comunicações (últimos 3 anos) <span class="pill ok" style="font-size:10px">↳ plano</span></label><input type="number" id="cv_pub" value="${cv.pub}" min="0"></div>
     ${TA('cv_outrasAct','Outras atividades académicas relevantes (júris, comités, professor convidado, conselhos científicos/editoriais)',cv.outrasAct)}
   </div>
     <div style="margin-top:16px"><button class="btn gold" onclick="applyCV('${who.replace(/'/g,"\\'")}')">✔ Guardar e aplicar ao plano</button></div>
     <div class="note"><b>Como alimenta o plano:</b>
       <div class="flow">
         <span class="n">Grau → «Grau (auto)»</span><span class="ar">→</span>
         <span class="n">Especialidade → «Especialidade (auto)»</span><span class="ar">→</span>
         <span class="n">INAAREES → «INAAREES (auto)»</span><span class="ar">→</span>
         <span class="n">Capacitação → «Cap. pedag. (auto)»</span><span class="ar">→</span>
         <span class="n">Grau/Título/Especialização/Experiência → justificação da conformidade</span>
       </div>
       Ao guardar, todas as linhas do plano onde este docente esteja atribuído (em qualquer curso) são atualizadas. Os restantes campos ficam no dossier do docente.</div>
   </div></div>`;
}
function applyCV(who){
  if(!P().editCV){toast('O CV Estruturado é preenchido pelo perfil GRH');return;}
  const cv=state.cv[who]; const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  ['email','nasc','tel','resid','licInst','mestArea','mestInst','doutArea','doutInst','outros','grauCient','tituloAcad','catCient','trabalho','ies','regime','linhas','ministra','ministraPos','publicacoes','outrasAct'].forEach(k=>cv[k]=g('cv_'+k));
  cv.grau=g('cv_grau'); cv.esp=g('cv_esp'); cv.ina=g('cv_ina'); cv.ped=g('cv_ped'); cv.cat=g('cv_cat'); cv.exp=g('cv_exp'); cv.pub=g('cv_pub');
  const d=DOCMAP[who];
  d.grau=cv.grau; d.esp=cv.esp;
  d.ina = cv.ina==='Sim' ? (d.ina && d.ina!=='Sem declaração' && d.ina!=='Não registado' ? d.ina : 'Com declaração') : 'Sem declaração';
  d.cap = cv.ped;
  toast('CV (modelo MESCTI) aplicado — ficha do docente e plano atualizados');
  render();
}

/* ---------- aprovações — docente a docente (Presidente) ---------- */
function docentesAtribuidos(){
  const map={};
  CURSOS.forEach(c=>{ const yc=(state.plan3[state.year]||{})[c]||{};
    Object.keys(yc).forEach(t=>Object.values(yc[t]).forEach(r=>{ if(r.docente){
      const m=map[r.docente]=map[r.docente]||{cursos:new Set(),turmas:new Set(),cells:0,confSim:0};
      m.cursos.add(c); m.turmas.add(t); m.cells++; if(r.conf==='Sim')m.confSim++;
    }}));
  });
  return map;
}
function vAprov(){
  const canApprove=P().aprova;
  const map=docentesAtribuidos();
  const docs=Object.keys(map).sort();
  const nAp=docs.filter(n=>state.aprov[n]==='Aprovado').length;
  const nDe=docs.filter(n=>state.aprov[n]==='Devolvido').length;
  const nPend=docs.length-nAp-nDe;
  let rows;
  if(!docs.length){
    rows=`<tr><td colspan="6" style="color:var(--mut);padding:16px">Ainda não há docentes atribuídos no ano lectivo ${state.year.replace('/','/20')}. Atribua docentes na Cobertura Docente para que apareçam aqui para aprovação.</td></tr>`;
  } else {
    rows=docs.map(n=>{
      const m=map[n]; const d=DOCMAP[n]; const est=state.aprov[n]||'Pendente';
      const ep=est==='Aprovado'?'ok':est==='Devolvido'?'bad':'warn';
      const acts= canApprove
        ? `<button class="btn sm" onclick="aprovar('${n.replace(/'/g,"\\'")}','Aprovado')">Aprovar</button>
           <button class="btn sm ghost" onclick="aprovar('${n.replace(/'/g,"\\'")}','Devolvido')">Devolver</button>`
        : `<span class="pill mut">só o Presidente aprova</span>`;
      return `<tr><td><b>${n}</b><div style="font-size:11px;color:var(--mut)">${d?d.grau:''}</div></td>
        <td>${[...m.cursos].join(', ')}</td>
        <td class="rownum">${m.cells}</td>
        <td class="rownum">${m.turmas.size}</td>
        <td><span class="pill ${ep}">${est}</span></td>
        <td>${acts}</td></tr>`;
    }).join('');
  }
  return `<h2 class="page">Aprovação da Cobertura Docente <span class="demo-tag">docente a docente</span></h2>
   <p class="sub">Ano lectivo ${state.year.replace('/','/20')} · ${canApprove?'O Presidente aprova ou devolve a atribuição de cada docente, individualmente.':'Consulta do estado de aprovação (aprovação reservada ao Presidente).'}</p>
   <div class="tiles">
     <div class="tile"><div class="k">Docentes atribuídos</div><div class="v">${docs.length}</div></div>
     <div class="tile good"><div class="k">Aprovados</div><div class="v">${nAp}</div></div>
     <div class="tile warn"><div class="k">Pendentes</div><div class="v">${nPend}</div></div>
     <div class="tile bad"><div class="k">Devolvidos</div><div class="v">${nDe}</div></div>
   </div>
   <div class="card"><div class="bd" style="padding:0"><table>
     <thead><tr><th>Docente</th><th>Cursos</th><th>Atribuições</th><th>Turmas</th><th>Estado</th><th>Ação</th></tr></thead>
     <tbody>${rows}</tbody></table></div></div>`;
}
function aprovar(n,estado){ if(!P().aprova){toast('Aprovação reservada ao Presidente');return;} state.aprov[n]=estado; toast(`${n}: ${estado} (simulação)`); render(); }

/* ---------- administração ---------- */
function vConfig(){
  return `<h2 class="page">Administração <span class="demo-tag">acesso administrador</span></h2>
   <p class="sub">Configuração do sistema. Disponível apenas para o perfil Administração.</p>
   <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
     <div class="card"><div class="hd">Anos lectivos</div><div class="bd">2025/2026 (histórico) · <b>2026/2027 (ativo)</b> · 2027/2028 (planeamento). Abertura/fecho e transição (roll-over) entre anos.</div></div>
     <div class="card"><div class="hd">Perfis e permissões</div><div class="bd">Coordenador, Gestão Académica, GRH, Presidente, Secretário-Geral, Administração — atribuição de utilizadores a perfis.</div></div>
     <div class="card"><div class="hd">Currículo e turmas</div><div class="bd">Sincronização de cursos, disciplinas e turmas a partir do Gestão Escolar (por ID interno).</div></div>
     <div class="card"><div class="hd">Listas de valores</div><div class="bd">Conformidade, Justificação da conformidade, Regime, Categorias, Pareceres.</div></div>
   </div>`;
}

/* ---------- util ---------- */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
render();
</script>
